server {
    listen 80;
    server_name localhost;
    underscores_in_headers on;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Chỉ chuyển tiếp đến các nhà cung cấp được cho phép; không nhận URL đích tùy ý.
    # Yêu cầu tạo ảnh có thể chứa dữ liệu base64 nên cần tăng giới hạn dung lượng.
    location ~ ^/api-proxy/openrouter/(.*)$ {
        client_max_body_size 50m;
        set $path $1;
        proxy_pass https://openrouter.ai/$path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host openrouter.ai;
        proxy_set_header Origin "https://openrouter.ai";
        proxy_set_header Referer "https://openrouter.ai/";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }

    location ~ ^/api-proxy/google/(.*)$ {
        client_max_body_size 50m;
        set $path $1;
        proxy_pass https://generativelanguage.googleapis.com/$path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_set_header Origin "https://generativelanguage.googleapis.com";
        proxy_set_header Referer "https://generativelanguage.googleapis.com/";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-goog-api-key $http_x_goog_api_key;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }

    location ~ ^/api-proxy/replicate/(.*)$ {
        client_max_body_size 50m;
        set $path $1;
        proxy_pass https://api.replicate.com/$path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.replicate.com;
        proxy_set_header Origin "https://api.replicate.com";
        proxy_set_header Referer "https://api.replicate.com/";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    location ~ ^/api-proxy/fpt/(.*)$ {
        client_max_body_size 5m;
        set $path $1;
        proxy_pass https://api.fpt.ai/$path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.fpt.ai;
        proxy_set_header api_key $http_api_key;
        proxy_set_header voice $http_voice;
        proxy_set_header speed $http_speed;
        proxy_set_header format $http_format;
        proxy_read_timeout 180s;
    }

    location ~ ^/api-proxy/viettel/(.*)$ {
        client_max_body_size 5m;
        set $path $1;
        proxy_pass https://viettelai.vn/$path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host viettelai.vn;
        proxy_read_timeout 180s;
    }

    location ~ ^/api-proxy/elevenlabs/(.*)$ {
        client_max_body_size 5m;
        set $path $1;
        proxy_pass https://api.elevenlabs.io/$path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.elevenlabs.io;
        proxy_set_header xi-api-key $http_xi_api_key;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
