server {
    listen 80;
    server_name localhost;
    underscores_in_headers on;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Chỉ chuyển tiếp đến các nhà cung cấp được cho phép; không nhận URL đích tùy ý.
    # Yêu cầu tạo ảnh có thể chứa dữ liệu base64 nên cần tăng giới hạn dung lượng.
    location ~ ^/api-proxy/facebook/(.*)$ {
        client_max_body_size 10m;
        set $path $1;
        proxy_pass https://graph.facebook.com/$path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host graph.facebook.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    location ~ ^/api-proxy/threads/(.*)$ {
        client_max_body_size 10m;
        set $path $1;
        proxy_pass https://graph.threads.net/$path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host graph.threads.net;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    location ~ ^/api-proxy/zalo/(.*)$ {
        client_max_body_size 10m;
        set $path $1;
        proxy_pass https://openapi.zalo.me/$path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host openapi.zalo.me;
        proxy_set_header access_token $http_access_token;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    # Các cổng AI cũ bị khóa trong chế độ ShopAIKey nội bộ.
    location ~ ^/api-proxy/(openrouter|google|replicate|kie|kie-files|fpt|viettel|elevenlabs)(/|$) {
        return 410;
    }

    location ~ ^/api-proxy/shopaikey/(.*)$ {
        client_max_body_size 50m;
        set $path $1;
        proxy_pass https://api.shopaikey.com/$path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.shopaikey.com;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1200s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
